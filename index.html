<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Launcher</title>
<style>
:root{
  --bg:#0b0d14; --bg2:#141827; --card:#1a1f31; --text:#f2f4fa; --muted:#98a0b8;
  --accent:#6c8cff; --focus:#ffffff; --glow:rgba(108,140,255,.55);
}
:root[data-theme="light"]{
  --bg:#eef1f8; --bg2:#dfe4f1; --card:#ffffff; --text:#151a2b; --muted:#59627d;
  --accent:#3d5afe; --focus:#151a2b; --glow:rgba(61,90,254,.4);
}
:root[data-theme="ambient"]{
  --bg:#07060f; --bg2:#1a1038; --card:rgba(255,255,255,.08); --text:#f5f2ff; --muted:#b3a9d6;
  --accent:#c084fc; --focus:#fff; --glow:rgba(192,132,252,.6);
}
*{box-sizing:border-box;margin:0}
html{font-size:clamp(14px,1.25vw,24px)}
body{
  min-height:100vh; color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(120% 90% at 15% 0%,var(--bg2),var(--bg)) fixed; overflow-x:hidden;
}
:root[data-theme="ambient"] body::before{
  content:""; position:fixed; inset:-20%; z-index:-1; filter:blur(60px); opacity:.7;
  background:radial-gradient(40% 40% at 20% 30%,#7c3aed88,transparent),
             radial-gradient(35% 35% at 80% 20%,#06b6d488,transparent),
             radial-gradient(40% 40% at 60% 85%,#ec489988,transparent);
  animation:drift 22s ease-in-out infinite alternate;
}
@keyframes drift{to{transform:translate(4%,3%) scale(1.1) rotate(6deg)}}
.wrap{max-width:1600px;margin:0 auto;padding:2rem 2.5rem 3rem}
header{display:grid;grid-template-columns:1fr auto;gap:2rem;align-items:start}
.clock{font-size:5.5rem;font-weight:200;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.date{color:var(--muted);font-size:1.3rem;margin-top:.4rem}
.greet{color:var(--accent);font-size:1.1rem;margin-bottom:.4rem}
.weather{background:var(--card);border-radius:1.2rem;padding:1.1rem 1.4rem;min-width:22rem;backdrop-filter:blur(12px)}
.wnow{display:flex;align-items:center;gap:1rem}
.wicon{font-size:3rem}
.wtemp{font-size:2.6rem;font-weight:300}
.wmeta{color:var(--muted);font-size:.95rem}
.wdays{display:grid;grid-template-columns:repeat(5,1fr);gap:.4rem;margin-top:.9rem;text-align:center;font-size:.85rem;color:var(--muted)}
.wdays b{display:block;color:var(--text);font-weight:500}
.wdays span.i{display:block;font-size:1.4rem;margin:.15rem 0}
.bar{display:flex;gap:1rem;align-items:center;margin:2rem 0 1.5rem;flex-wrap:wrap}
.search{flex:1;min-width:16rem;display:flex;align-items:center;gap:.7rem;background:var(--card);border-radius:999px;padding:.2rem 1.2rem;border:3px solid transparent}
.search:focus-within{border-color:var(--focus);box-shadow:0 0 0 6px var(--glow)}
.search input{flex:1;background:none;border:0;outline:0;color:var(--text);font-size:1.2rem;padding:.8rem 0}
.search input::placeholder{color:var(--muted)}
button,.tile,.chip{font:inherit;color:inherit;cursor:pointer}
.chip{background:var(--card);border:3px solid transparent;border-radius:999px;padding:.75rem 1.4rem;font-size:1.05rem;transition:transform .15s}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(12rem,1fr));gap:1.4rem}
.tile{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;
  aspect-ratio:16/10;border-radius:1.4rem;text-decoration:none;border:4px solid transparent;
  background:linear-gradient(145deg,var(--c,#333),color-mix(in srgb,var(--c,#333) 55%,#000));
  color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.25);transition:transform .18s,box-shadow .18s;outline:none;
}
.tile img{width:3.4rem;height:3.4rem;filter:invert(1);object-fit:contain}
.tile .fb{display:none;font-size:2.4rem;font-weight:700}
.tile .name{font-size:1.15rem;font-weight:600;letter-spacing:.01em}
.tile:focus,.chip:focus,.tile:hover{transform:scale(1.08);border-color:var(--focus);box-shadow:0 0 0 6px var(--glow),0 18px 40px rgba(0,0,0,.45);z-index:2;outline:none}
.chip:focus{transform:scale(1.05);border-color:var(--focus);box-shadow:0 0 0 5px var(--glow)}
.tile.dragover{opacity:.5}
.edit .tile{animation:wob .35s ease-in-out infinite alternate}
@keyframes wob{from{transform:rotate(-.6deg)}to{transform:rotate(.6deg)}}
.tools{position:absolute;inset:auto 0 .5rem 0;display:none;justify-content:center;gap:.4rem}
.edit .tools{display:flex}
.tools button{background:rgba(0,0,0,.55);border:2px solid transparent;color:#fff;border-radius:.6rem;padding:.2rem .6rem;font-size:1rem}
.tools button:focus{border-color:#fff;outline:none;background:#000}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:3rem;font-size:1.2rem}
footer{margin-top:2.5rem;color:var(--muted);font-size:.9rem;display:flex;gap:1.5rem;flex-wrap:wrap}
kbd{background:var(--card);border-radius:.4rem;padding:.1rem .5rem}
dialog{border:0;border-radius:1.4rem;background:var(--bg2);color:var(--text);padding:1.8rem;width:min(34rem,92vw)}
dialog::backdrop{background:rgba(0,0,0,.65);backdrop-filter:blur(4px)}
dialog h2{margin-bottom:1rem;font-weight:500}
dialog label{display:block;margin:.8rem 0 .3rem;color:var(--muted);font-size:.95rem}
dialog input{width:100%;background:var(--card);border:3px solid transparent;border-radius:.8rem;padding:.7rem 1rem;color:var(--text);font-size:1.1rem;outline:0}
dialog input:focus{border-color:var(--focus)}
.row{display:flex;gap:.8rem;margin-top:1.4rem;justify-content:flex-end}
@media (max-width:800px){header{grid-template-columns:1fr}.clock{font-size:3.6rem}.wrap{padding:1.2rem}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <div>
      <div class="greet" id="greet"></div>
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date"></div>
    </div>
    <div class="weather" id="weather" aria-live="polite">
      <div class="wmeta">Loading weather…</div>
    </div>
  </header>

  <div class="bar">
    <label class="search">
      <span aria-hidden="true">🔍</span>
      <input id="q" type="search" placeholder="Search services…  (press / to focus)" autocomplete="off" aria-label="Search services">
    </label>
    <button class="chip" id="btnTheme">🎨 Theme: Dark</button>
    <button class="chip" id="btnEdit" aria-pressed="false">✏️ Edit tiles</button>
    <button class="chip" id="btnAdd" hidden>＋ Add</button>
    <button class="chip" id="btnLoc">📍 Location</button>
  </div>

  <main class="grid" id="grid" aria-label="Streaming services"></main>

  <footer>
    <span><kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> move</span>
    <span><kbd>Enter</kbd> open</span>
    <span><kbd>/</kbd> search</span>
    <span><kbd>Esc</kbd>/<kbd>Back</kbd> close or clear</span>
    <span><kbd>1–9</kbd> quick launch</span>
  </footer>
</div>

<dialog id="dlgAdd">
  <h2>Add service</h2>
  <form method="dialog" id="fAdd">
    <label for="aName">Name</label><input id="aName" required maxlength="24">
    <label for="aUrl">Web address</label><input id="aUrl" type="url" required placeholder="https://…">
    <label for="aIcon">Icon slug (optional, from simpleicons.org)</label><input id="aIcon" placeholder="e.g. twitch">
    <label for="aColor">Color</label><input id="aColor" type="color" value="#6c8cff">
    <div class="row"><button class="chip" type="button" id="aCancel">Cancel</button><button class="chip" style="background:var(--accent);color:#fff">Add</button></div>
  </form>
</dialog>

<dialog id="dlgLoc">
  <h2>Weather location</h2>
  <form method="dialog" id="fLoc">
    <label for="lCity">City</label><input id="lCity" required placeholder="e.g. Berlin">
    <div class="row"><button class="chip" type="button" id="lGeo">Use my location</button><button class="chip" type="button" id="lCancel">Cancel</button><button class="chip" style="background:var(--accent);color:#fff">Save</button></div>
  </form>
</dialog>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const store = {
    get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  /* ---------- Data ---------- */
  const DEFAULTS = [
    {name:"Netflix",url:"https://www.netflix.com",icon:"netflix",color:"#b20710"},
    {name:"YouTube",url:"https://www.youtube.com/tv",icon:"youtube",color:"#c4302b"},
    {name:"Prime Video",url:"https://www.primevideo.com",icon:"primevideo",color:"#0a7fb8"},
    {name:"Disney+",url:"https://www.disneyplus.com",icon:"disneyplus",color:"#113ccf"},
    {name:"DAZN",url:"https://www.dazn.com",icon:"dazn",color:"#2b2f3a"},
    {name:"Zattoo",url:"https://zattoo.com/watch",icon:"zattoo",color:"#d9730d"},
    {name:"Joyn",url:"https://www.joyn.de",icon:"",color:"#e5007d"},
    {name:"RTL+",url:"https://plus.rtl.de",icon:"",color:"#c8102e"},
    {name:"HD+",url:"https://www.hd-plus.de",icon:"",color:"#00649b"},
    {name:"Plex",url:"https://watch.plex.tv",icon:"plex",color:"#b8860b"},
    {name:"ARD Mediathek",url:"https://www.ardmediathek.de",icon:"",color:"#0b3a8c"},
    {name:"ARTE",url:"https://www.arte.tv",icon:"",color:"#d45500"}
  ];
  let tiles = store.get("tiles", DEFAULTS);
  let editing = false;

  /* ---------- Theme ---------- */
  const THEMES = ["dark","light","ambient"];
  let theme = store.get("theme","dark");
  function applyTheme(){
    document.documentElement.dataset.theme = theme;
    $("#btnTheme").textContent = "🎨 Theme: " + theme[0].toUpperCase() + theme.slice(1);
  }
  $("#btnTheme").onclick = () => { theme = THEMES[(THEMES.indexOf(theme)+1)%THEMES.length]; store.set("theme",theme); applyTheme(); };
  applyTheme();

  /* ---------- Clock ---------- */
  function tick(){
    const d = new Date();
    $("#clock").textContent = d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",hour12:false});
    $("#date").textContent = d.toLocaleDateString([], {weekday:"long",day:"numeric",month:"long",year:"numeric"});
    const h = d.getHours();
    $("#greet").textContent = h<5?"Good night":h<12?"Good morning":h<18?"Good afternoon":"Good evening";
  }
  tick(); setInterval(tick, 15000);

  /* ---------- Tiles ---------- */
  const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  function render(){
    const q = $("#q").value.trim().toLowerCase();
    const g = $("#grid");
    g.classList.toggle("edit", editing);
    const list = tiles.map((t,i)=>({t,i})).filter(({t}) => !q || t.name.toLowerCase().includes(q));
    if(!list.length){ g.innerHTML = `<div class="empty">No service matches “${esc(q)}”.</div>`; return; }
    g.innerHTML = list.map(({t,i},n) => `
      <a class="tile" href="${esc(t.url)}" data-i="${i}" style="--c:${esc(t.color||"#333")}" ${editing?'':'rel="noopener"'} aria-label="${esc(t.name)}">
        ${t.icon?`<img alt="" src="https://cdn.jsdelivr.net/npm/simple-icons@13/icons/${encodeURIComponent(t.icon)}.svg">`:""}
        <span class="fb" ${t.icon?"":'style="display:block"'}>${esc(t.name.slice(0,2))}</span>
        <span class="name">${esc(t.name)}</span>
        <span class="tools">
          <button data-act="left" aria-label="Move left">◀</button>
          <button data-act="del" aria-label="Remove">✕</button>
          <button data-act="right" aria-label="Move right">▶</button>
        </span>
      </a>`).join("");
    g.querySelectorAll("img").forEach(im => im.onerror = () => { im.style.display="none"; im.nextElementSibling.style.display="block"; });
  }
  $("#grid").addEventListener("click", e => {
    const tile = e.target.closest(".tile"); if(!tile) return;
    const i = +tile.dataset.i, btn = e.target.closest("[data-act]");
    if(editing){
      e.preventDefault();
      if(!btn) return;
      const act = btn.dataset.act;
      if(act==="del") tiles.splice(i,1);
      else { const j = act==="left"?i-1:i+1; if(j<0||j>=tiles.length) return; [tiles[i],tiles[j]]=[tiles[j],tiles[i]]; }
      store.set("tiles",tiles); render();
      const f = $(`.tile[data-i="${act==="del"?Math.min(i,tiles.length-1):(act==="left"?i-1:i+1)}"] [data-act="${act}"]`) || $(".tile");
      f && f.focus();
    }
  });
  $("#q").addEventListener("input", render);
  $("#q").addEventListener("keydown", e => {
    if(e.key==="Enter"){ const first = $(".tile"); if(first && !editing) first.click(); }
  });

  $("#btnEdit").onclick = () => {
    editing = !editing;
    $("#btnEdit").setAttribute("aria-pressed", editing);
    $("#btnEdit").textContent = editing ? "✔ Done" : "✏️ Edit tiles";
    $("#btnAdd").hidden = !editing;
    render();
  };

  /* ---------- Add dialog ---------- */
  const dAdd = $("#dlgAdd");
  $("#btnAdd").onclick = () => { $("#fAdd").reset(); dAdd.showModal(); $("#aName").focus(); };
  $("#aCancel").onclick = () => dAdd.close();
  $("#fAdd").addEventListener("submit", () => {
    tiles.push({name:$("#aName").value.trim(), url:$("#aUrl").value.trim(), icon:$("#aIcon").value.trim().toLowerCase(), color:$("#aColor").value});
    store.set("tiles",tiles); render();
  });

  /* ---------- Weather ---------- */
  const WX = c => c===0?["☀️","Clear"]:c<=2?["🌤️","Partly cloudy"]:c===3?["☁️","Overcast"]:c<=48?["🌫️","Fog"]:c<=57?["🌦️","Drizzle"]:c<=67?["🌧️","Rain"]:c<=77?["🌨️","Snow"]:c<=82?["🌧️","Showers"]:c<=86?["🌨️","Snow showers"]:["⛈️","Thunderstorm"];
  let loc = store.get("loc", {name:"Lagos, NG",lat:6.5244,lon:3.3792});
  async function loadWeather(){
    const box = $("#weather");
    try{
      const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=5`);
      if(!r.ok) throw 0;
      const w = await r.json(), c = w.current, [ic,txt] = WX(c.weather_code);
      const days = w.daily.time.map((d,i)=>`<div><b>${i?new Date(d+"T12:00").toLocaleDateString([], {weekday:"short"}):"Today"}</b><span class="i">${WX(w.daily.weather_code[i])[0]}</span>${Math.round(w.daily.temperature_2m_max[i])}° / ${Math.round(w.daily.temperature_2m_min[i])}°</div>`).join("");
      box.innerHTML = `<div class="wnow"><span class="wicon">${ic}</span><div><div class="wtemp">${Math.round(c.temperature_2m)}°C</div><div class="wmeta">${txt} · feels ${Math.round(c.apparent_temperature)}° · wind ${Math.round(c.wind_speed_10m)} km/h</div><div class="wmeta">${esc(loc.name)}</div></div></div><div class="wdays">${days}</div>`;
    }catch{ box.innerHTML = `<div class="wmeta">Weather unavailable. Check your connection or set a location.</div>`; }
  }
  loadWeather(); setInterval(loadWeather, 15*60*1000);

  const dLoc = $("#dlgLoc");
  $("#btnLoc").onclick = () => { dLoc.showModal(); $("#lCity").focus(); };
  $("#lCancel").onclick = () => dLoc.close();
  $("#lGeo").onclick = () => navigator.geolocation?.getCurrentPosition(p => {
    loc = {name:"My location",lat:p.coords.latitude,lon:p.coords.longitude}; store.set("loc",loc); dLoc.close(); loadWeather();
  }, () => alert("Location not available on this device."));
  $("#fLoc").addEventListener("submit", async () => {
    try{
      const r = await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?count=1&name=${encodeURIComponent($("#lCity").value)}`)).json();
      const p = r.results && r.results[0];
      if(p){ loc = {name:`${p.name}, ${p.country_code||""}`,lat:p.latitude,lon:p.longitude}; store.set("loc",loc); loadWeather(); }
      else alert("City not found.");
    }catch{ alert("Could not look up that city."); }
  });

  /* ---------- Remote / keyboard spatial navigation ---------- */
  const focusables = () => [...document.querySelectorAll(".wrap a.tile, .wrap button, .wrap input")]
    .filter(el => !el.closest("[hidden]") && el.offsetParent !== null && !el.disabled);
  function move(dir){
    const els = focusables(), cur = document.activeElement;
    if(!els.includes(cur)){ (els.find(e=>e.classList.contains("tile"))||els[0])?.focus(); return; }
    const a = cur.getBoundingClientRect(), ac = {x:a.left+a.width/2, y:a.top+a.height/2};
    let best=null, bs=Infinity;
    for(const el of els){
      if(el===cur) continue;
      const b = el.getBoundingClientRect(), bc = {x:b.left+b.width/2, y:b.top+b.height/2};
      const dx = bc.x-ac.x, dy = bc.y-ac.y;
      const ok = dir==="ArrowRight"?dx>8 && Math.abs(dy)<=Math.abs(dx)*1.6 :
                 dir==="ArrowLeft" ?dx<-8 && Math.abs(dy)<=Math.abs(dx)*1.6 :
                 dir==="ArrowDown" ?dy>8 && Math.abs(dx)<=Math.abs(dy)*1.6 :
                                    dy<-8 && Math.abs(dx)<=Math.abs(dy)*1.6;
      if(!ok) continue;
      const main = (dir==="ArrowLeft"||dir==="ArrowRight")?Math.abs(dx):Math.abs(dy);
      const cross = (dir==="ArrowLeft"||dir==="ArrowRight")?Math.abs(dy):Math.abs(dx);
      const s = main + cross*2.5;
      if(s<bs){ bs=s; best=el; }
    }
    if(best){ best.focus(); best.scrollIntoView({block:"center",behavior:"smooth"}); }
  }
  addEventListener("keydown", e => {
    const inInput = document.activeElement === $("#q") || document.activeElement.tagName==="INPUT";
    if(document.querySelector("dialog[open]")){ return; } // native dialog handles Esc/Tab
    if(e.key.startsWith("Arrow")){
      if(inInput && (e.key==="ArrowLeft"||e.key==="ArrowRight") ) return; // allow caret movement
      e.preventDefault(); move(e.key); return;
    }
    if(e.key==="/" && !inInput){ e.preventDefault(); $("#q").focus(); return; }
    if(["Escape","Backspace","BrowserBack","GoBack"].includes(e.key) || e.keyCode===461 || e.keyCode===10009){
      if(inInput && e.key==="Backspace") return;
      if($("#q").value){ $("#q").value=""; render(); $(".tile")?.focus(); e.preventDefault(); }
      else if(editing){ $("#btnEdit").click(); e.preventDefault(); }
      return;
    }
    if(/^[1-9]$/.test(e.key) && !inInput && !editing){
      const t = document.querySelectorAll(".tile")[+e.key-1]; t && t.click();
    }
  });

  render();
  $(".tile")?.focus();
})();
</script>
</body>
</html>
