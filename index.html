<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home</title>
<style>
  * {
    box-sizing: border-box;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #05070d;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
  }
  .bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: #05070d;
    background-image: url('background.jpg');
    background-size: cover;
    background-position: center;
  }
  .overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(5, 7, 13, 0.55);
  }
  .content {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    padding: 4% 3%;
  }
  .top-row {
    width: 100%;
  }
  .clock-block {
    text-align: center;
  }
  .clock {
    font-size: 7.5vw;
    font-weight: bold;
    letter-spacing: 0.1em;
    margin: 0;
    line-height: 1.1;
  }
  .date {
    font-size: 1.6vw;
    color: #cfd6e6;
    margin-top: 0.5em;
    letter-spacing: 0.05em;
  }
  .weather {
    text-align: center;
    margin-top: 1.2em;
    font-size: 1.8vw;
    color: #ffffff;
  }
  .weather .temp {
    font-weight: bold;
  }
  .weather .place {
    color: #cfd6e6;
    font-size: 0.75em;
    margin-left: 0.4em;
  }
  .row {
    width: 100%;
    text-align: center;
    margin-top: 5%;
  }
  .tile {
    display: inline-block;
    width: 9.5%;
    max-width: 190px;
    min-width: 110px;
    margin: 0.6%;
    background-color: rgba(255, 255, 255, 0.08);
    border: 2px solid rgba(255, 255, 255, 0.25);
    border-radius: 18px;
    text-decoration: none;
    color: #ffffff;
    vertical-align: top;
    padding: 1.2vw 0.5vw;
  }
  .tile .icon {
    display: block;
    height: 3vw;
    min-height: 28px;
    max-height: 48px;
    margin: 0 auto;
  }
  .tile .label {
    display: block;
    font-size: 1.1vw;
    min-font-size: 14px;
    margin-top: 0.8vw;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tile:focus,
  .tile:hover {
    background-color: rgba(255, 255, 255, 0.22);
    border-color: #4da3ff;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="overlay"></div>
  <div class="content">
    <div class="top-row">
      <div class="clock-block">
        <div class="clock" id="clock">--:--</div>
        <div class="date" id="date"></div>
        <div class="weather" id="weather">Loading weather&hellip;</div>
      </div>
    </div>
    <div class="row">
      <a class="tile" href="https://www.youtube.com/tv" tabindex="1">
        <img class="icon" src="https://cdn.jsdelivr.net/npm/simple-icons@v13/icons/youtube.svg" style="filter: invert(1);" alt="">
        <span class="label">YouTube</span>
      </a>
      <a class="tile" href="https://www.netflix.com" tabindex="2">
        <img class="icon" src="https://cdn.jsdelivr.net/npm/simple-icons@v13/icons/netflix.svg" style="filter: invert(1);" alt="">
        <span class="label">Netflix</span>
      </a>
      <a class="tile" href="https://www.primevideo.com" tabindex="3">
        <img class="icon" src="https://cdn.jsdelivr.net/npm/simple-icons@v13/icons/primevideo.svg" style="filter: invert(1);" alt="">
        <span class="label">Prime Video</span>
      </a>
      <a class="tile" href="https://www.disneyplus.com" tabindex="4">
        <img class="icon" src="https://cdn.jsdelivr.net/npm/simple-icons@v13/icons/disneyplus.svg" style="filter: invert(1);" alt="">
        <span class="label">Disney+</span>
      </a>
      <a class="tile" href="https://www.plex.tv/watch-free" tabindex="5">
        <img class="icon" src="https://cdn.jsdelivr.net/npm/simple-icons@v13/icons/plex.svg" style="filter: invert(1);" alt="">
        <span class="label">Plex</span>
      </a>
      <a class="tile" href="https://www.zdf.de" tabindex="6">
        <img class="icon" src="https://cdn.jsdelivr.net/npm/simple-icons@v13/icons/zdf.svg" style="filter: invert(1);" alt="">
        <span class="label">ZDF</span>
      </a>
      <a class="tile" href="https://www.ardmediathek.de" tabindex="7">
        <img class="icon" src="https://cdn.jsdelivr.net/npm/simple-icons@v13/icons/ard.svg" style="filter: invert(1);" alt="">
        <span class="label">ARD</span>
      </a>
      <a class="tile" href="https://www.arte.tv" tabindex="8">
        <img class="icon" src="https://cdn.jsdelivr.net/npm/simple-icons@v13/icons/arte.svg" style="filter: invert(1);" alt="">
        <span class="label">ARTE</span>
      </a>
    </div>
  </div>
<script>
function pad(n) {
  n = n + "";
  if (n.length < 2) { return "0" + n; }
  return n;
}
var DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
var MONTHS = ["January", "February", "March", "April", "May", "June", "July",
              "August", "September", "October", "November", "December"];
function tick() {
  var now = new Date();
  var h = now.getHours();
  var ampm = h >= 12 ? "PM" : "AM";
  var h12 = h % 12;
  if (h12 === 0) { h12 = 12; }
  document.getElementById("clock").innerHTML = h12 + ":" + pad(now.getMinutes()) + " " + ampm;
  document.getElementById("date").innerHTML =
    DAYS[now.getDay()] + ", " + MONTHS[now.getMonth()] + " " + now.getDate() + ", " + now.getFullYear();
}
tick();
setInterval(tick, 30000);

// Lagos, Nigeria coordinates
var LAT = 6.5244;
var LON = 3.3792;

var WEATHER_CODES = {
  0: "Clear sky", 1: "Mostly clear", 2: "Partly cloudy", 3: "Overcast",
  45: "Fog", 48: "Fog", 51: "Light drizzle", 53: "Drizzle", 55: "Heavy drizzle",
  61: "Light rain", 63: "Rain", 65: "Heavy rain", 80: "Rain showers",
  81: "Rain showers", 82: "Violent showers", 95: "Thunderstorm"
};

function loadWeather() {
  var xhr = new XMLHttpRequest();
  var url = "https://api.open-meteo.com/v1/forecast?latitude=" + LAT +
    "&longitude=" + LON + "&current_weather=true&timezone=auto";
  xhr.open("GET", url, true);
  xhr.onreadystatechange = function () {
    if (xhr.readyState === 4) {
      if (xhr.status === 200) {
        try {
          var data = JSON.parse(xhr.responseText);
          var cw = data.current_weather;
          var desc = WEATHER_CODES[cw.weathercode] || "";
          var temp = Math.round(cw.temperature);
          document.getElementById("weather").innerHTML =
            '<span class="temp">' + temp + '&deg;C</span> ' + desc +
            '<span class="place">Lagos, Nigeria</span>';
        } catch (e) {
          document.getElementById("weather").innerHTML = "";
        }
      } else {
        document.getElementById("weather").innerHTML = "";
      }
    }
  };
  xhr.send();
}
loadWeather();
setInterval(loadWeather, 15 * 60 * 1000);
</script>
</body>
</html>
