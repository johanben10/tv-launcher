<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
<style>
  * {
    box-sizing: border-box;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #05070d;
    color: #ffffff;
    font-family: 'Inter', Arial, Helvetica, sans-serif;
    overflow: hidden;
  }
  .bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: #05070d;
    background-image: url('background.jpg');
    background-size: cover;
    background-position: center;
  }
  .overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(5, 7, 13, 0.58);
  }
  .content {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    padding: 4% 3%;
    opacity: 0;
    transition: opacity 1.1s ease-out;
  }
  .content.ready {
    opacity: 1;
  }
  .top-row {
    width: 100%;
  }
  .clock-block {
    text-align: center;
  }
  .clock {
    font-size: 7vw;
    font-weight: 800;
    letter-spacing: 0.08em;
    margin: 0;
    line-height: 1.1;
    text-shadow: 0 4px 24px rgba(0, 0, 0, 0.55);
  }
  .date {
    font-size: 1.5vw;
    font-weight: 400;
    color: #cfd6e6;
    margin-top: 0.5em;
    letter-spacing: 0.05em;
  }
  .weather {
    text-align: center;
    margin-top: 1em;
    font-size: 1.7vw;
    font-weight: 600;
    color: #ffffff;
  }
  .weather .temp {
    font-weight: 800;
  }
  .weather .place {
    color: #cfd6e6;
    font-weight: 400;
    font-size: 0.7em;
    margin-left: 0.4em;
  }
  .row {
    width: 100%;
    text-align: center;
    margin-top: 4.5%;
  }
  .tile {
    display: inline-block;
    width: 8.2%;
    max-width: 165px;
    min-width: 100px;
    margin: 0.5%;
    background-color: rgba(255, 255, 255, 0.08);
    border: 2px solid rgba(255, 255, 255, 0.22);
    border-radius: 18px;
    text-decoration: none;
    color: #ffffff;
    vertical-align: top;
    padding: 1.1vw 0.4vw;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    transition: background-color 0.2s ease, border-color 0.2s ease,
      transform 0.2s ease, box-shadow 0.2s ease;
  }
  .tile .icon {
    display: block;
    height: 2.6vw;
    min-height: 24px;
    max-height: 42px;
    margin: 0 auto;
  }
  .tile .icon-fallback {
    display: none;
    width: 2.6vw;
    height: 2.6vw;
    min-width: 24px;
    min-height: 24px;
    max-width: 42px;
    max-height: 42px;
    margin: 0 auto;
    border-radius: 50%;
    background-color: rgba(255, 255, 255, 0.18);
    color: #ffffff;
    font-weight: 800;
    font-size: 1.1vw;
    line-height: 1;
    align-items: center;
    justify-content: center;
  }
  .tile .label {
    display: block;
    font-size: 1vw;
    margin-top: 0.7vw;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tile:focus,
  .tile:hover {
    background-color: rgba(255, 255, 255, 0.22);
    border-color: #4da3ff;
    transform: translateY(-4px) scale(1.04);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="overlay"></div>
  <div class="content" id="content">
    <div class="top-row">
      <div class="clock-block">
        <div class="clock" id="clock">--:--</div>
        <div class="date" id="date"></div>
        <div class="weather" id="weather">Loading weather&hellip;</div>
      </div>
    </div>
    <div class="row" id="tileRow">
      <a class="tile" href="https://www.netflix.com" data-label="Netflix">
        <img class="icon" src="https://cdn.jsdelivr.net/npm/simple-icons@v13/icons/netflix.svg" style="filter: invert(1);" alt="">
        <span class="label">Netflix</span>
      </a>
      <a class="tile" href="https://www.youtube.com/tv" data-label="YouTube">
        <img class="icon" src="https://cdn.jsdelivr.net/npm/simple-icons@v13/icons/youtube.svg" style="filter: invert(1);" alt="">
        <span class="label">YouTube</span>
      </a>
      <a class="tile" href="https://www.primevideo.com" data-label="Prime Video">
        <img class="icon" src="https://cdn.jsdelivr.net/npm/simple-icons@v13/icons/primevideo.svg" style="filter: invert(1);" alt="">
        <span class="label">Prime Video</span>
      </a>
      <a class="tile" href="https://www.disneyplus.com" data-label="Disney+">
        <img class="icon" src="https://cdn.jsdelivr.net/npm/simple-icons@v13/icons/disneyplus.svg" style="filter: invert(1);" alt="">
        <span class="label">Disney+</span>
      </a>
      <a class="tile" href="https://www.dazn.com" data-label="DAZN">
        <img class="icon" src="https://cdn.jsdelivr.net/npm/simple-icons@v13/icons/dazn.svg" style="filter: invert(1);" alt="">
        <span class="label">DAZN</span>
      </a>
      <a class="tile" href="https://zattoo.com" data-label="Zattoo">
        <img class="icon" src="https://cdn.jsdelivr.net/npm/simple-icons@v13/icons/zattoo.svg" style="filter: invert(1);" alt="">
        <span class="label">Zattoo</span>
      </a>
      <a class="tile" href="https://www.joyn.de" data-label="Joyn">
        <img class="icon" src="https://cdn.jsdelivr.net/npm/simple-icons@v13/icons/joyn.svg" style="filter: invert(1);" alt="">
        <span class="label">Joyn</span>
      </a>
      <a class="tile" href="https://www.rtlplus.de" data-label="RTL+">
        <img class="icon" src="https://cdn.jsdelivr.net/npm/simple-icons@v13/icons/rtl.svg" style="filter: invert(1);" alt="">
        <span class="label">RTL+</span>
      </a>
      <a class="tile" href="https://www.hdplus.de" data-label="HD+">
        <img class="icon" src="https://cdn.jsdelivr.net/npm/simple-icons@v13/icons/hd.svg" style="filter: invert(1);" alt="">
        <span class="label">HD+</span>
      </a>
      <a class="tile" href="https://www.plex.tv/watch-free" data-label="Plex">
        <img class="icon" src="https://cdn.jsdelivr.net/npm/simple-icons@v13/icons/plex.svg" style="filter: invert(1);" alt="">
        <span class="label">Plex</span>
      </a>
      <a class="tile" href="https://www.ardmediathek.de" data-label="ARD">
        <img class="icon" src="https://cdn.jsdelivr.net/npm/simple-icons@v13/icons/ard.svg" style="filter: invert(1);" alt="">
        <span class="label">ARD</span>
      </a>
      <a class="tile" href="https://www.arte.tv" data-label="ARTE">
        <img class="icon" src="https://cdn.jsdelivr.net/npm/simple-icons@v13/icons/arte.svg" style="filter: invert(1);" alt="">
        <span class="label">ARTE</span>
      </a>
    </div>
  </div>
<script>
function pad(n) {
  n = n + "";
  if (n.length < 2) { return "0" + n; }
  return n;
}
var DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
var MONTHS = ["January", "February", "March", "April", "May", "June", "July",
              "August", "September", "October", "November", "December"];
function tick() {
  var now = new Date();
  var h = now.getHours();
  var ampm = h >= 12 ? "PM" : "AM";
  var h12 = h % 12;
  if (h12 === 0) { h12 = 12; }
  document.getElementById("clock").innerHTML = h12 + ":" + pad(now.getMinutes()) + " " + ampm;
  document.getElementById("date").innerHTML =
    DAYS[now.getDay()] + ", " + MONTHS[now.getMonth()] + " " + now.getDate() + ", " + now.getFullYear();
}
tick();
setInterval(tick, 30000);

// Lagos, Nigeria coordinates
var LAT = 6.5244;
var LON = 3.3792;

var WEATHER_CODES = {
  0: "Clear sky", 1: "Mostly clear", 2: "Partly cloudy", 3: "Overcast",
  45: "Fog", 48: "Fog", 51: "Light drizzle", 53: "Drizzle", 55: "Heavy drizzle",
  61: "Light rain", 63: "Rain", 65: "Heavy rain", 80: "Rain showers",
  81: "Rain showers", 82: "Violent showers", 95: "Thunderstorm"
};

function loadWeather() {
  var xhr = new XMLHttpRequest();
  var url = "https://api.open-meteo.com/v1/forecast?latitude=" + LAT +
    "&longitude=" + LON + "&current_weather=true&timezone=auto";
  xhr.open("GET", url, true);
  xhr.onreadystatechange = function () {
    if (xhr.readyState === 4) {
      if (xhr.status === 200) {
        try {
          var data = JSON.parse(xhr.responseText);
          var cw = data.current_weather;
          var desc = WEATHER_CODES[cw.weathercode] || "";
          var temp = Math.round(cw.temperature);
          document.getElementById("weather").innerHTML =
            '<span class="temp">' + temp + '&deg;C</span> ' + desc +
            '<span class="place">Lagos, Nigeria</span>';
        } catch (e) {
          document.getElementById("weather").innerHTML = "";
        }
      } else {
        document.getElementById("weather").innerHTML = "";
      }
    }
  };
  xhr.send();
}
loadWeather();
setInterval(loadWeather, 15 * 60 * 1000);

// Fall back to a letter badge if a brand icon fails to load (e.g. not in the icon set).
var icons = document.querySelectorAll(".tile .icon");
for (var i = 0; i < icons.length; i++) {
  (function (img) {
    img.onerror = function () {
      var tile = img.parentNode;
      var label = tile.getAttribute("data-label") || "?";
      var badge = document.createElement("div");
      badge.className = "icon-fallback";
      badge.style.display = "flex";
      badge.textContent = label.charAt(0);
      img.style.display = "none";
      tile.insertBefore(badge, img);
    };
  })(icons[i]);
}

function goFullscreen() {
  try {
    var el = document.documentElement;
    if (el.requestFullscreen) { el.requestFullscreen(); }
    else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
    else if (el.webkitRequestFullScreen) { el.webkitRequestFullScreen(); }
    else if (el.mozRequestFullScreen) { el.mozRequestFullScreen(); }
    else if (el.msRequestFullscreen) { el.msRequestFullscreen(); }
  } catch (e) {}
}
window.addEventListener("load", function () {
  goFullscreen();
  setTimeout(function () {
    document.getElementById("content").className = "content ready";
  }, 50);
});
document.addEventListener("click", goFullscreen);
</script>
</body>
</html>
