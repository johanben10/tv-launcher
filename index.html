<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Launcher</title>
<style>
:root{
  --bg:#0b0d14; --bg2:#141827; --card:#1a1f31; --text:#f2f4fa; --muted:#98a0b8;
  --accent:#6c8cff; --focus:#ffffff; --glow:rgba(108,140,255,.55);
}
:root[data-theme="light"]{
  --bg:#eef1f8; --bg2:#dfe4f1; --card:#ffffff; --text:#151a2b; --muted:#59627d;
  --accent:#3d5afe; --focus:#151a2b; --glow:rgba(61,90,254,.4);
}
:root[data-theme="ambient"]{
  --bg:#07060f; --bg2:#1a1038; --card:#241a3a; --text:#f5f2ff; --muted:#b3a9d6;
  --accent:#c084fc; --focus:#fff; --glow:rgba(192,132,252,.6);
}
*{box-sizing:border-box;margin:0}
html{font-size:14px}
html, body{
  width:100%;
  min-height:100%;
}
body{
  color:var(--text); font-family:Arial,Helvetica,sans-serif;
  background-color:var(--bg);
  background-image:linear-gradient(135deg,var(--bg2),var(--bg));
  overflow-x:hidden;
  overflow-y:auto;
  padding-bottom:4vh;
}
.wrap{max-width:1600px;width:100%;margin:0 auto;padding:2.5vh 3vw 3vh}
header{display:block;width:100%;overflow:hidden}
.header-left{float:left;max-width:60%}
.header-right{float:right;max-width:38%}
.clock{font-size:3.2rem;font-weight:bold;letter-spacing:-0.02em;line-height:1.1}
.date{color:var(--muted);font-size:1rem;margin-top:.3rem}
.greet{color:var(--accent);font-size:.95rem;margin-bottom:.3rem}
.weather{background-color:var(--card);border-radius:1rem;padding:.8rem 1.1rem;width:100%;max-width:19rem}
.wnow{overflow:hidden}
.wicon{font-size:2rem;float:left;margin-right:.8rem}
.wtemp{font-size:1.7rem;font-weight:bold}
.wmeta{color:var(--muted);font-size:.9rem}
.wdays{margin-top:.9rem;text-align:center;font-size:.8rem;color:var(--muted);overflow:hidden}
.wdays .d{float:left;width:20%}
.wdays b{display:block;color:var(--text);font-weight:bold}
.wdays span.i{display:block;font-size:1.3rem;margin:.15rem 0}
.bar{margin:1.2rem 0 1rem;overflow:hidden}
.search{display:block;overflow:hidden;background-color:var(--card);border-radius:999px;padding:.1rem 1rem;border:3px solid transparent;float:left;width:36%}
.search.focused{border-color:var(--focus)}
.search input{width:100%;background:none;border:0;outline:0;color:var(--text);font-size:.95rem;padding:.6rem 0}
button,.tile,.chip{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
.chip{background-color:var(--card);border:3px solid transparent;border-radius:999px;padding:.55rem 1rem;font-size:.9rem;float:left;margin-left:.6rem}
.chip[aria-pressed="true"]{background-color:var(--accent);color:#fff}
.grid{overflow:hidden}
.tile{
  position:relative;display:block;float:left;text-align:center;
  width:9.5rem;height:6.2rem;margin:0 .9rem .9rem 0;border-radius:1rem;text-decoration:none;
  border:3px solid transparent;background-color:#333333;color:#fff;
  padding-top:1.1rem;
}
.tile .inner{display:block;}
.tile img{width:2.2rem;height:2.2rem;filter:invert(1);display:block;margin:0 auto}
.tile .fb{display:none;font-size:1.5rem;font-weight:bold}
.tile .name{display:block;font-size:.85rem;font-weight:bold;margin-top:.5rem}
.tile.tv-focus,.chip.tv-focus{border-color:var(--focus);background-color:#444444}
.tools{position:absolute;left:0;right:0;bottom:.4rem;text-align:center;display:none}
.edit .tools{display:block}
.tools button{background-color:rgba(0,0,0,.55);border:2px solid transparent;color:#fff;border-radius:.5rem;padding:.2rem .5rem;font-size:.9rem;margin:0 .15rem}
.empty{clear:both;text-align:center;color:var(--muted);padding:3rem;font-size:1.1rem}
footer{clear:both;margin-top:2.5rem;color:var(--muted);font-size:.85rem}
footer span{margin-right:1.4rem}
kbd{background-color:var(--card);border-radius:.4rem;padding:.1rem .5rem}
.dlg{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background-color:rgba(0,0,0,.65);z-index:50}
.dlg.open{display:block}
.dlg .box{background-color:var(--bg2);color:var(--text);padding:1.8rem;width:30rem;max-width:90%;border-radius:1.2rem;margin:8% auto}
.dlg h2{margin-bottom:1rem;font-weight:normal}
.dlg label{display:block;margin:.8rem 0 .3rem;color:var(--muted);font-size:.9rem}
.dlg input{width:100%;background-color:var(--card);border:3px solid transparent;border-radius:.7rem;padding:.6rem .9rem;color:var(--text);font-size:1rem}
.dlg .row{overflow:hidden;margin-top:1.3rem;text-align:right}
.dlg .row .chip{float:none;display:inline-block;margin-left:.6rem}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <div class="header-left">
      <div class="greet" id="greet"></div>
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date"></div>
    </div>
    <div class="header-right">
      <div class="weather" id="weather">
        <div class="wmeta">Loading weather...</div>
      </div>
    </div>
  </header>

  <div class="bar">
    <div class="search" id="searchBox">
      <input id="q" type="text" placeholder="Search services..." autocomplete="off">
    </div>
    <button class="chip" id="btnTheme">Theme: Dark</button>
    <button class="chip" id="btnEdit">Edit tiles</button>
    <button class="chip" id="btnAdd" style="display:none;">+ Add</button>
    <button class="chip" id="btnLoc">Location</button>
  </div>

  <main class="grid" id="grid"></main>

  <footer>
    <span><kbd>Arrows</kbd> move</span>
    <span><kbd>OK</kbd> open</span>
    <span><kbd>Back</kbd> close or clear</span>
  </footer>
</div>

<div class="dlg" id="dlgAdd">
  <div class="box">
    <h2>Add service</h2>
    <label for="aName">Name</label><input id="aName" maxlength="24">
    <label for="aUrl">Web address</label><input id="aUrl" placeholder="https://...">
    <label for="aIcon">Icon slug (optional, from simpleicons.org)</label><input id="aIcon" placeholder="e.g. twitch">
    <label for="aColor">Color (hex, e.g. #6c8cff)</label><input id="aColor" value="#6c8cff">
    <div class="row"><button class="chip" id="aCancel">Cancel</button><button class="chip" id="aSave" style="background-color:#6c8cff;color:#fff;">Add</button></div>
  </div>
</div>

<div class="dlg" id="dlgLoc">
  <div class="box">
    <h2>Weather location</h2>
    <label for="lCity">City</label><input id="lCity" placeholder="e.g. Lagos">
    <div class="row"><button class="chip" id="lCancel">Cancel</button><button class="chip" id="lSave" style="background-color:#6c8cff;color:#fff;">Save</button></div>
  </div>
</div>

<script>
function $(sel) { return document.querySelector(sel); }
function $all(sel) { return document.querySelectorAll(sel); }

var store = {
  get: function (k, d) {
    try {
      var v = localStorage.getItem(k);
      return v ? JSON.parse(v) : d;
    } catch (e) { return d; }
  },
  set: function (k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
  }
};

/* ---------- Data ---------- */
var DEFAULTS = [
  { name: "Netflix", url: "https://www.netflix.com", icon: "netflix", color: "#b20710" },
  { name: "YouTube", url: "https://www.youtube.com/tv", icon: "youtube", color: "#c4302b" },
  { name: "Prime Video", url: "https://www.primevideo.com", icon: "primevideo", color: "#0a7fb8" },
  { name: "Disney+", url: "https://www.disneyplus.com", icon: "disneyplus", color: "#113ccf" },
  { name: "DAZN", url: "https://www.dazn.com", icon: "dazn", color: "#2b2f3a" },
  { name: "Zattoo", url: "https://zattoo.com/watch", icon: "zattoo", color: "#d9730d" },
  { name: "Joyn", url: "https://www.joyn.de", icon: "", color: "#e5007d" },
  { name: "RTL+", url: "https://plus.rtl.de", icon: "", color: "#c8102e" },
  { name: "HD+", url: "https://www.hd-plus.de", icon: "", color: "#00649b" },
  { name: "Plex", url: "https://watch.plex.tv", icon: "plex", color: "#b8860b" },
  { name: "ARD Mediathek", url: "https://www.ardmediathek.de", icon: "", color: "#0b3a8c" },
  { name: "ARTE", url: "https://www.arte.tv", icon: "", color: "#d45500" }
];
var tiles = store.get("tiles", DEFAULTS);
var editing = false;

/* ---------- Theme ---------- */
var THEMES = ["dark", "light", "ambient"];
var theme = store.get("theme", "dark");
function applyTheme() {
  document.documentElement.setAttribute("data-theme", theme);
  var label = theme.charAt(0).toUpperCase() + theme.slice(1);
  $("#btnTheme").innerHTML = "Theme: " + label;
}
$("#btnTheme").onclick = function () {
  var idx = THEMES.indexOf(theme);
  theme = THEMES[(idx + 1) % THEMES.length];
  store.set("theme", theme);
  applyTheme();
};
applyTheme();

/* ---------- Clock ---------- */
var DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
var MONTHS = ["January", "February", "March", "April", "May", "June", "July",
  "August", "September", "October", "November", "December"];
function pad(n) {
  n = n + "";
  if (n.length < 2) { return "0" + n; }
  return n;
}
function tick() {
  var d = new Date();
  $("#clock").innerHTML = pad(d.getHours()) + ":" + pad(d.getMinutes());
  $("#date").innerHTML = DAYS[d.getDay()] + ", " + d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear();
  var h = d.getHours();
  var greeting = h < 5 ? "Good night" : h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
  $("#greet").innerHTML = greeting;
}
tick();
setInterval(tick, 15000);

/* ---------- Tiles ---------- */
function esc(s) {
  s = s == null ? "" : String(s);
  return s.replace(/[&<>"']/g, function (c) {
    if (c === "&") { return "&amp;"; }
    if (c === "<") { return "&lt;"; }
    if (c === ">") { return "&gt;"; }
    if (c === '"') { return "&quot;"; }
    return "&#39;";
  });
}

function render() {
  var q = $("#q").value.replace(/^\s+|\s+$/g, "").toLowerCase();
  var g = $("#grid");
  if (editing) { g.className = "grid edit"; } else { g.className = "grid"; }

  var list = [];
  var i;
  for (i = 0; i < tiles.length; i++) {
    if (!q || tiles[i].name.toLowerCase().indexOf(q) !== -1) {
      list.push({ t: tiles[i], i: i });
    }
  }

  if (list.length === 0) {
    g.innerHTML = '<div class="empty">No service matches "' + esc(q) + '".</div>';
    return;
  }

  var html = "";
  for (i = 0; i < list.length; i++) {
    var t = list[i].t;
    var idx = list[i].i;
    var color = esc(t.color || "#333333");
    html += '<a class="tile" href="' + esc(t.url) + '" data-i="' + idx + '" style="background-color:' + color + ';" tabindex="0">';
    if (t.icon) {
      html += '<img alt="" src="https://cdn.jsdelivr.net/npm/simple-icons@13/icons/' + encodeURIComponent(t.icon) + '.svg">';
      html += '<span class="fb">' + esc(t.name.slice(0, 2)) + '</span>';
    } else {
      html += '<span class="fb" style="display:block">' + esc(t.name.slice(0, 2)) + '</span>';
    }
    html += '<span class="name">' + esc(t.name) + '</span>';
    html += '<span class="tools">';
    html += '<button data-act="left">&lt;</button>';
    html += '<button data-act="del">X</button>';
    html += '<button data-act="right">&gt;</button>';
    html += '</span>';
    html += '</a>';
  }
  g.innerHTML = html;

  var imgs = g.querySelectorAll("img");
  for (i = 0; i < imgs.length; i++) {
    imgs[i].onerror = (function (im) {
      return function () {
        im.style.display = "none";
        var fb = im.nextSibling;
        if (fb) { fb.style.display = "block"; }
      };
    })(imgs[i]);
  }
}

$("#grid").addEventListener("click", function (e) {
  var tile = e.target;
  while (tile && tile.className.indexOf("tile") === -1) { tile = tile.parentNode; }
  if (!tile || !tile.getAttribute) { return; }
  var idx = parseInt(tile.getAttribute("data-i"), 10);

  var btn = e.target;
  var actEl = null;
  while (btn && btn !== tile) {
    if (btn.getAttribute && btn.getAttribute("data-act")) { actEl = btn; break; }
    btn = btn.parentNode;
  }

  if (editing) {
    e.preventDefault();
    if (!actEl) { return; }
    var act = actEl.getAttribute("data-act");
    if (act === "del") {
      tiles.splice(idx, 1);
    } else {
      var j = act === "left" ? idx - 1 : idx + 1;
      if (j < 0 || j >= tiles.length) { return; }
      var tmp = tiles[idx];
      tiles[idx] = tiles[j];
      tiles[j] = tmp;
    }
    store.set("tiles", tiles);
    render();
  }
});

$("#q").addEventListener("input", render);
$("#q").addEventListener("focus", function () { $("#searchBox").className = "search focused"; });
$("#q").addEventListener("blur", function () { $("#searchBox").className = "search"; });

$("#btnEdit").onclick = function () {
  editing = !editing;
  $("#btnEdit").innerHTML = editing ? "Done" : "Edit tiles";
  $("#btnAdd").style.display = editing ? "" : "none";
  render();
};

/* ---------- Add dialog ---------- */
var dAdd = $("#dlgAdd");
$("#btnAdd").onclick = function () {
  $("#aName").value = "";
  $("#aUrl").value = "";
  $("#aIcon").value = "";
  $("#aColor").value = "#6c8cff";
  dAdd.className = "dlg open";
};
$("#aCancel").onclick = function () { dAdd.className = "dlg"; };
$("#aSave").onclick = function () {
  var name = $("#aName").value.replace(/^\s+|\s+$/g, "");
  var url = $("#aUrl").value.replace(/^\s+|\s+$/g, "");
  if (!name || !url) { return; }
  tiles.push({
    name: name,
    url: url,
    icon: $("#aIcon").value.replace(/^\s+|\s+$/g, "").toLowerCase(),
    color: $("#aColor").value || "#333333"
  });
  store.set("tiles", tiles);
  dAdd.className = "dlg";
  render();
};

/* ---------- Weather ---------- */
function weatherInfo(code) {
  if (code === 0) { return ["Clear", "Clear sky"]; }
  if (code <= 2) { return ["PCld", "Partly cloudy"]; }
  if (code === 3) { return ["Ovcst", "Overcast"]; }
  if (code <= 48) { return ["Fog", "Fog"]; }
  if (code <= 57) { return ["Drzl", "Drizzle"]; }
  if (code <= 67) { return ["Rain", "Rain"]; }
  if (code <= 77) { return ["Snow", "Snow"]; }
  if (code <= 82) { return ["Show", "Showers"]; }
  if (code <= 86) { return ["Snow", "Snow showers"]; }
  return ["Strm", "Thunderstorm"];
}

var loc = store.get("loc", { name: "Lagos, NG", lat: 6.5244, lon: 3.3792 });

function loadWeather() {
  var box = $("#weather");
  var xhr = new XMLHttpRequest();
  var url = "https://api.open-meteo.com/v1/forecast?latitude=" + loc.lat +
    "&longitude=" + loc.lon +
    "&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m" +
    "&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=5";
  xhr.open("GET", url, true);
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4) { return; }
    if (xhr.status !== 200) {
      box.innerHTML = '<div class="wmeta">Weather unavailable.</div>';
      return;
    }
    try {
      var w = JSON.parse(xhr.responseText);
      var c = w.current;
      var info = weatherInfo(c.weather_code);
      var html = '<div class="wnow"><span class="wicon">' + info[0] + '</span>';
      html += '<div><div class="wtemp">' + Math.round(c.temperature_2m) + 'C</div>';
      html += '<div class="wmeta">' + info[1] + ' - feels ' + Math.round(c.apparent_temperature) +
        'C - wind ' + Math.round(c.wind_speed_10m) + ' km/h</div>';
      html += '<div class="wmeta">' + esc(loc.name) + '</div></div></div>';
      html += '<div class="wdays">';
      var i;
      for (i = 0; i < w.daily.time.length; i++) {
        var dayInfo = weatherInfo(w.daily.weather_code[i]);
        var label = i === 0 ? "Today" : DAYS[new Date(w.daily.time[i] + "T12:00:00").getDay()].slice(0, 3);
        html += '<div class="d"><b>' + label + '</b><span class="i">' + dayInfo[0] + '</span>' +
          Math.round(w.daily.temperature_2m_max[i]) + '/' + Math.round(w.daily.temperature_2m_min[i]) + '</div>';
      }
      html += '</div>';
      box.innerHTML = html;
    } catch (e) {
      box.innerHTML = '<div class="wmeta">Weather unavailable.</div>';
    }
  };
  xhr.send();
}
loadWeather();
setInterval(loadWeather, 15 * 60 * 1000);

var dLoc = $("#dlgLoc");
$("#btnLoc").onclick = function () {
  $("#lCity").value = "";
  dLoc.className = "dlg open";
};
$("#lCancel").onclick = function () { dLoc.className = "dlg"; };
$("#lSave").onclick = function () {
  var city = $("#lCity").value.replace(/^\s+|\s+$/g, "");
  if (!city) { return; }
  var xhr = new XMLHttpRequest();
  var url = "https://geocoding-api.open-meteo.com/v1/search?count=1&name=" + encodeURIComponent(city);
  xhr.open("GET", url, true);
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4) { return; }
    try {
      var data = JSON.parse(xhr.responseText);
      if (data.results && data.results[0]) {
        var p = data.results[0];
        loc = { name: p.name + ", " + (p.country_code || ""), lat: p.latitude, lon: p.longitude };
        store.set("loc", loc);
        dLoc.className = "dlg";
        loadWeather();
      } else {
        alert("City not found.");
      }
    } catch (e) {
      alert("Could not look up that city.");
    }
  };
  xhr.send();
};

/* ---------- Remote D-pad navigation ---------- */
function focusables() {
  var els = $all(".wrap a.tile, .wrap button, .wrap input");
  var out = [];
  var i;
  for (i = 0; i < els.length; i++) {
    if (els[i].offsetParent !== null) { out.push(els[i]); }
  }
  return out;
}

function clearFocusClass() {
  var all = $all(".tv-focus");
  var i;
  for (i = 0; i < all.length; i++) {
    all[i].className = all[i].className.replace(/\s*tv-focus\s*/, " ");
  }
}

document.addEventListener("focus", function (e) {
  clearFocusClass();
  if (e.target && e.target.className !== undefined) {
    e.target.className = e.target.className + " tv-focus";
  }
}, true);

function moveFocus(dir) {
  var els = focusables();
  var cur = document.activeElement;
  var idx = -1;
  var i;
  for (i = 0; i < els.length; i++) {
    if (els[i] === cur) { idx = i; break; }
  }
  if (idx === -1) {
    if (els.length > 0) { els[0].focus(); }
    return;
  }
  var a = cur.getBoundingClientRect();
  var ac = { x: a.left + a.width / 2, y: a.top + a.height / 2 };
  var best = null;
  var bestScore = Infinity;
  for (i = 0; i < els.length; i++) {
    if (els[i] === cur) { continue; }
    var b = els[i].getBoundingClientRect();
    var bc = { x: b.left + b.width / 2, y: b.top + b.height / 2 };
    var dx = bc.x - ac.x;
    var dy = bc.y - ac.y;
    var ok = false;
    if (dir === "right") { ok = dx > 8 && Math.abs(dy) <= Math.abs(dx) * 1.6; }
    else if (dir === "left") { ok = dx < -8 && Math.abs(dy) <= Math.abs(dx) * 1.6; }
    else if (dir === "down") { ok = dy > 8 && Math.abs(dx) <= Math.abs(dy) * 1.6; }
    else { ok = dy < -8 && Math.abs(dx) <= Math.abs(dy) * 1.6; }
    if (!ok) { continue; }
    var main = (dir === "left" || dir === "right") ? Math.abs(dx) : Math.abs(dy);
    var cross = (dir === "left" || dir === "right") ? Math.abs(dy) : Math.abs(dx);
    var score = main + cross * 2.5;
    if (score < bestScore) { bestScore = score; best = els[i]; }
  }
  if (best) {
    best.focus();
    if (best.scrollIntoView) { best.scrollIntoView(); }
  }
}

document.addEventListener("keydown", function (e) {
  var key = e.key;
  var active = document.activeElement;
  var inInput = active && active.tagName === "INPUT";

  if (key === "ArrowRight") { if (!inInput) { e.preventDefault(); moveFocus("right"); } return; }
  if (key === "ArrowLeft") { if (!inInput) { e.preventDefault(); moveFocus("left"); } return; }
  if (key === "ArrowDown") { e.preventDefault(); moveFocus("down"); return; }
  if (key === "ArrowUp") { e.preventDefault(); moveFocus("up"); return; }

  if (key === "Escape" || key === "Backspace" || e.keyCode === 461 || e.keyCode === 10009) {
    if (inInput) { return; }
    if ($("#q").value) {
      $("#q").value = "";
      render();
      e.preventDefault();
    } else if (dAdd.className.indexOf("open") !== -1) {
      dAdd.className = "dlg";
      e.preventDefault();
    } else if (dLoc.className.indexOf("open") !== -1) {
      dLoc.className = "dlg";
      e.preventDefault();
    } else if (editing) {
      $("#btnEdit").click();
      e.preventDefault();
    }
  }
});

render();
var firstTile = $(".tile");
if (firstTile) { firstTile.focus(); }
</script>
</body>
</html>
